<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="prideSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f3"/>
      <stop offset="55%" stop-color="#fadce0"/>
      <stop offset="100%" stop-color="#dec0a8"/>
    </linearGradient>
    <radialGradient id="prideBloom" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbd7df"/>
      <stop offset="100%" stop-color="#e08fa5"/>
    </radialGradient>
    <radialGradient id="prideCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c47a"/>
      <stop offset="100%" stop-color="#b86a4a"/>
    </radialGradient>
  </defs>
  <rect width="260" height="140" fill="url(#prideSky)"/>

  <!-- distant pagoda silhouette -->
  <g fill="#7a4d62" opacity="0.45">
    <rect x="195" y="78" width="36" height="38"/>
    <polygon points="190,78 236,78 213,64"/>
    <rect x="201" y="58" width="24" height="20"/>
    <polygon points="197,58 229,58 213,46"/>
    <rect x="206" y="42" width="14" height="16"/>
    <polygon points="203,42 223,42 213,32"/>
  </g>

  <!-- ground hills -->
  <path d="M0,115 L60,100 L120,112 L180,104 L260,116 L260,140 L0,140 Z" fill="#b88a72" opacity="0.55"/>

  <!-- three lion silhouettes (simplified profile) -->
  <g fill="#7a3e4a" opacity="0.78">
    <!-- center, larger -->
    <ellipse cx="105" cy="108" rx="20" ry="12"/>
    <circle cx="123" cy="100" r="10"/>
    <circle cx="125" cy="95" r="12" fill="#a85070" opacity="0.85"/>
    <circle cx="123" cy="100" r="8" fill="#7a3e4a"/>
    <rect x="85" y="105" width="3" height="14"/>
    <rect x="118" y="116" width="3" height="6"/>
    <!-- left, smaller -->
    <ellipse cx="55" cy="115" rx="14" ry="8"/>
    <circle cx="68" cy="110" r="6.5"/>
    <circle cx="68.5" cy="108" r="7.5" fill="#a85070" opacity="0.85"/>
    <circle cx="68" cy="110" r="5" fill="#7a3e4a"/>
    <!-- right, smaller -->
    <ellipse cx="160" cy="116" rx="14" ry="8"/>
    <circle cx="146" cy="111" r="6.5"/>
    <circle cx="145.5" cy="109" r="7.5" fill="#a85070" opacity="0.85"/>
    <circle cx="146" cy="111" r="5" fill="#7a3e4a"/>
  </g>

  <!-- cherry blossom branch above -->
  <path d="M-5,40 Q70,25 130,42 Q190,58 270,40" stroke="#7a4d3a" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <g id="pb">
    <circle cx="0" cy="-6" r="4.5" fill="url(#prideBloom)"/>
    <circle cx="5.7" cy="-1.8" r="4.5" fill="url(#prideBloom)"/>
    <circle cx="3.6" cy="5.4" r="4.5" fill="url(#prideBloom)"/>
    <circle cx="-3.6" cy="5.4" r="4.5" fill="url(#prideBloom)"/>
    <circle cx="-5.7" cy="-1.8" r="4.5" fill="url(#prideBloom)"/>
    <circle cx="0" cy="0" r="1.7" fill="url(#prideCenter)"/>
  </g>
  <use href="#pb" transform="translate(28,36)"/>
  <use href="#pb" transform="translate(72,28) scale(1.1)"/>
  <use href="#pb" transform="translate(120,40) scale(0.95)"/>
  <use href="#pb" transform="translate(165,30) scale(1.05)"/>
  <use href="#pb" transform="translate(225,38) scale(1.0)"/>

  <!-- drifting petals -->
  <ellipse cx="40" cy="80" rx="3" ry="5" fill="#fbd7df" opacity="0.75" transform="rotate(40 40 80)"/>
  <ellipse cx="185" cy="78" rx="3" ry="5.5" fill="#f5b4c0" opacity="0.70" transform="rotate(-30 185 78)"/>
</svg>
